<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>环境保护意识调查问卷</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg0:#eff0ec;--fg0:#2b2b2b;--greenD:#0e2a13;--greenF:#a8e0a0;--redD:#1a0000;--redF:#ff6b5b;--vine:#5f9c4a;--vb:#9adf7a;--blood:#ff3b30}
html,body{height:100%}
body{font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;color:var(--fg0);background:var(--bg0);transition:background 1.8s,color 1.2s;display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
body::before{content:"";position:fixed;top:-60%;left:-60%;right:-60%;bottom:-60%;background:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2"/></filter><rect width="200" height="200" filter="url(%23n)" opacity=".5"/></svg>');opacity:.05;pointer-events:none;z-index:0;animation:grain 20s linear infinite}
@keyframes grain{0%{transform:translate(0)}100%{transform:translate(40px,40px)}}
body.gm{background:var(--greenD);color:var(--greenF)}body.rm{background:var(--redD);color:var(--redF)}
body.gm::before{opacity:.12}body.rm::before{opacity:.22;filter:sepia(1) hue-rotate(300deg) saturate(3)}

#bloodink{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:0;box-shadow:inset 0 0 160px rgba(120,0,0,.6);transition:opacity 2s}
body.rm #bloodink{opacity:1}
#bloodink .drop{position:absolute;bottom:120%;width:4px;background:rgba(120,0,0,.55);border-radius:2px;animation:drip linear infinite}
@keyframes drip{to{bottom:-10%}}
#greenglow{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:0;box-shadow:inset 0 0 120px rgba(40,120,40,.35);transition:opacity 2s}
body.gm #greenglow{opacity:1}

#app{position:relative;z-index:4;width:min(680px,92vw);min-height:58vh;padding:30px 36px 28px;border-radius:2px;background:rgba(255,255,255,.72);border:1px solid #ccc;box-shadow:0 18px 50px rgba(0,0,0,.12);transition:background 1.4s,border 1.2s,box-shadow 1.2s,color .8s}
body.gm #app{background:rgba(8,22,10,.82);border-color:rgba(120,200,110,.35);box-shadow:0 0 60px rgba(60,160,60,.18)}
body.rm #app{background:rgba(20,0,0,.85);border-color:rgba(255,90,70,.4);box-shadow:0 0 70px rgba(190,0,0,.22)}

/* 进度条 */
#head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;font-size:12px;letter-spacing:1px;opacity:.7;flex-direction:column;gap:6px}
#meter{display:flex;align-items:center;gap:8px;font-weight:600;width:100%}
#meter .bar{flex:1;height:8px;background:rgba(0,0,0,.18);border-radius:4px;overflow:hidden;border:1px solid rgba(0,0,0,.1)}
body.gm #meter .bar{background:rgba(0,0,0,.4)}body.rm #meter .bar{background:rgba(0,0,0,.5)}
#meter .fill{height:100%;width:4%;background:#8b8b8b;border-radius:4px;transition:width 1.5s ease,background 1.5s}
body.gm #meter .fill{background:#7ee6a0}body.rm #meter .fill{background:#ff5a4b}
#meterLabel{font-size:11px;white-space:nowrap;min-width:70px}
#meterVal{font-size:11px;opacity:.8;white-space:nowrap}
#psub{font-size:11px;color:#aaa;min-height:14px;transition:color 1s,opacity 1s;letter-spacing:.5px}
body.rm #psub{color:#ff9a86}

#subtitle{font-size:12px;color:#8c8c8c;letter-spacing:1px;margin-bottom:6px;transition:color .6s}
body.gm #subtitle{color:#86c47e}body.rm #subtitle{color:#ff9a86}

#question{font-size:19px;font-weight:500;line-height:1.7;min-height:70px;margin-bottom:20px;opacity:0;transition:opacity .45s,filter .5s;user-select:none;position:relative}
#question.in{opacity:1}
body.rm #question{color:#ffd7d0}
/* 错版字体：重影、错位、笔画叠影 */
#question.corrupt{text-shadow:2px 0 rgba(255,80,60,.4),-2px 0 rgba(100,200,100,.3),0 3px 6px rgba(0,0,0,.2);animation:corruptShift 3s infinite,corruptJitter .28s steps(2) infinite}
@keyframes corruptShift{0%,85%{letter-spacing:0}88%{letter-spacing:6px;filter:blur(.5px)}92%{letter-spacing:0;filter:none}100%{letter-spacing:0}}
@keyframes corruptJitter{0%{transform:translate(0)}25%{transform:translate(-1px,.5px)}50%{transform:translate(1px,-.5px)}75%{transform:translate(-.5px,-1px)}100%{transform:translate(1px,1px)}}
/* 叠影鬼层：把题目文字复制成多层偏移，制造"许多笔画叠在一起" */
#question.corrupt::before,#question.corrupt::after{content:attr(data-ghost);position:absolute;top:0;left:0;white-space:pre-wrap;pointer-events:none;letter-spacing:inherit}
#question.corrupt::before{color:rgba(255,60,50,.25);transform:translate(3px,0);animation:ghostL 2.4s steps(3) infinite}
#question.corrupt::after{color:rgba(130,220,130,.2);transform:translate(-3px,1px);animation:ghostR 3.1s steps(3) infinite}
@keyframes ghostL{0%,30%{transform:translate(3px,0)}35%,65%{transform:translate(-4px,-1px)}70%,100%{transform:translate(4px,1px)}}
@keyframes ghostR{0%,30%{transform:translate(-3px,1px)}35%,65%{transform:translate(4px,-1px)}70%,100%{transform:translate(-5px,1px)}}

#opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;font-size:15px;line-height:1.5;padding:12px 15px;border-radius:4px;cursor:pointer;color:var(--fg0);background:rgba(0,0,0,.03);border:1px solid rgba(0,0,0,.1);transition:all .25s,opacity .4s,filter .3s;font-family:inherit;position:relative}
.opt:hover{background:rgba(0,0,0,.07)}
/* 环保 / 污染 模式下选项必须可见：浅色文字保证可读，同时带恐怖氛围 */
body.gm .opt{color:#d4efcd;background:rgba(100,190,110,.08);border-color:rgba(130,210,120,.35)}
body.gm .opt:hover{background:rgba(100,190,110,.2);border-color:rgba(160,230,150,.55)}
body.rm .opt{color:#ffd3c6;background:rgba(220,60,40,.09);border-color:rgba(255,70,50,.4);text-shadow:1px 1px 3px rgba(0,0,0,.5)}
body.rm .opt:hover{background:rgba(230,60,40,.22);border-color:rgba(255,110,90,.65);text-shadow:0 0 6px rgba(255,60,40,.5)}
.opt:disabled{cursor:default}.opt.dim{opacity:.28;filter:blur(1px)}
.opt.damp{border-left:3px solid var(--vine)}
.opt .drip{position:absolute;left:14px;bottom:4px;width:3px;height:0;background:var(--vine);border-radius:2px;opacity:.65}
/* 空选项呼吸 */
.opt.blank-opt{opacity:.35;border-style:dashed;border-color:rgba(0,0,0,.15);text-align:center;font-size:14px;color:transparent}
.opt.blank-opt:hover{animation:breathe 2s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.35}50%{transform:scale(1.06);opacity:.55}}
body.gm .opt.blank-opt{border-color:rgba(120,200,110,.3)}
body.rm .opt.blank-opt{border-color:rgba(255,90,70,.3)}
/* 只准选我：唯一跳动的暗红选项 */
.opt.onlyme{color:#ff3b2f;border-color:#ff3b2f;background:rgba(150,0,0,.12);text-align:center;font-size:18px;font-weight:700;letter-spacing:4px;animation:onlymePulse 1.2s ease-in-out infinite;text-shadow:0 0 12px rgba(255,40,30,.6)}
.opt.onlyme:hover{background:rgba(200,0,0,.22)}
@keyframes onlymePulse{0%,100%{transform:scale(1);box-shadow:0 0 10px rgba(255,30,20,.4);border-color:#ff3b2f}50%{transform:scale(1.05);box-shadow:0 0 26px rgba(255,30,20,.85);border-color:#ff564a}}

#feedback{margin-top:18px;min-height:24px;font-size:15px;line-height:1.6;white-space:pre-wrap;color:inherit;opacity:0;transition:opacity .4s}
#feedback.on{opacity:1}
#feedback.big{font-size:20px;font-weight:800;text-align:center;letter-spacing:2px}
#feedback.monster{color:#ff6a5a}#feedback.gentle{color:#a4e8a0}

#fill{display:none;flex-direction:column;gap:12px;margin-top:4px}
#fill.show{display:flex}
#fill input{padding:12px 14px;font-size:15px;color:#333;background:#fff;border:1px solid #bbb;border-radius:4px;font-family:inherit;outline:none}
body.gm #fill input{background:#0a1a0c;color:var(--greenF);border-color:#2c4a2c}
body.rm #fill input{background:#1a0000;color:var(--redF);border-color:#5a1a14}
#fillBtn{padding:11px 0;font-size:15px;cursor:pointer;font-family:inherit;background:#333;color:#fff;border:none;border-radius:4px}
body.gm #fillBtn{background:#2e5a2e}body.rm #fillBtn{background:#6a1a12}
#fillBtn:hover{background:#555}

#hint{font-size:12px;color:#9a9a9a;margin-top:14px;font-style:italic}
body.gm #hint{color:#6f8f68}body.rm #hint{color:#a06a60}

/* 回到上一题按钮 */
#backBtn{position:absolute;top:14px;right:16px;font-size:11px;color:inherit;opacity:.3;cursor:pointer;background:none;border:1px solid currentColor;border-radius:3px;padding:3px 8px;font-family:inherit;transition:opacity .3s;letter-spacing:1px}
#backBtn:hover{opacity:.6}
#backBtn.trapped{animation:trappedShake .15s infinite;opacity:.8;cursor:not-allowed}
@keyframes trappedShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}

/* 弹窗求饶 */
#popup{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.7)}
#popup.show{display:flex}
#popup .pbox{background:#f8f8f6;border:1px solid #ccc;border-radius:10px;max-width:380px;width:90%;padding:24px 20px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.25)}
#popup .ptitle{font-size:15px;color:#333;margin-bottom:18px;line-height:1.6}
#popup .pbtns{display:flex;gap:10px;justify-content:center}
#popup .pbtn{padding:8px 24px;font-size:14px;border-radius:6px;cursor:pointer;font-family:inherit;border:1px solid #bbb;background:#fff;color:#333;transition:background .2s}
#popup .pbtn:hover{background:#eee}
#popup .pbtn.alt{background:#c33;color:#fff;border-color:#c33}
#popup .pbtn.alt:hover{background:#a22}

/* 伪关闭 */
#fakequit{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:#000;color:#fff;font-size:20px;text-align:center;padding:30px;opacity:0;transition:opacity 1s}
#fakequit.show{display:flex;opacity:1}
#fakequit.fadein{opacity:1}

/* 假结束 */
#fakeend{position:fixed;inset:0;z-index:28;display:none;align-items:center;justify-content:center;background:rgba(255,255,255,.95);color:#333;text-align:center;flex-direction:column;gap:12px;font-size:18px}
#fakeend.show{display:flex}
#fakeend .fe-sub{font-size:13px;color:#999}
#fakeend .fe-main{font-size:22px;font-weight:500}

/* glitch全屏 */
#glitch{position:fixed;inset:0;z-index:25;display:none;background:#0b0000;color:#7ee6a0;font-family:monospace;font-size:14px;line-height:1.4;white-space:pre-wrap;overflow:hidden;padding:18px}
#glitch.green{background:#04100a;color:#7ee6a0}
#glitch.red{background:#0b0000;color:#ff5a4b}
#glitch.show{display:block}
#glitch .row{display:inline}
#glitch .row.red{color:#ff5a4b}
#glitch .row.green{color:#7ee6a0}
/* 清醒句：深绿，像藻类在乱码里蔓延 */
#glitch .lucid{color:#5fbf6f;text-shadow:0 0 10px #2f8a3a,0 0 22px rgba(60,160,70,.6);opacity:.92;animation:algae 2.2s infinite}
@keyframes algae{0%,100%{opacity:.92;text-shadow:0 0 8px #2f8a3a}50%{opacity:1;text-shadow:0 0 16px #4fd96a,0 0 30px rgba(80,200,90,.8)}}

/* 分线前入侵黑屏（Q12 与 Q13 之间）：环保温柔 / 污染歇斯底里 */
#glitch .cin{position:absolute;inset:0;padding:26px;display:flex;flex-direction:column;justify-content:center;align-items:center;/* 对话居中 */;box-sizing:border-box}
#glitch .cin .ln{display:block;opacity:0;font-size:17px;line-height:2;letter-spacing:1px;margin-top:14px;animation:cin-seep 2.2s forwards}
@keyframes cin-seep{0%{opacity:0;transform:translateY(26px)}60%{opacity:.9}100%{opacity:1;transform:translateY(0)}}
#glitch .cin .hold{opacity:0;animation:cin-seep 1.2s .2s forwards}
#glitch .cin .spread{letter-spacing:2px;animation:cin-seep 2s .2s forwards,spread 1.6s .4s forwards}
@keyframes spread{from{letter-spacing:2px}to{letter-spacing:9px}}
#glitch .cin .flash{font-size:32px;text-align:center;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;animation:flashbg .9s 1;opacity:0}
@keyframes flashbg{0%{opacity:0}30%{opacity:1}70%{opacity:1}100%{opacity:0}}
#glitch .cin .dim{color:#5a8f6a;animation:cin-seep 2.5s .2s forwards}
#glitch .cin .huge{font-size:44px;text-align:center;line-height:1.9;letter-spacing:18px;opacity:0;animation:floatup 4s 1s forwards}
@keyframes floatup{0%{opacity:0;transform:translateY(60px);letter-spacing:26px}60%{opacity:1}100%{opacity:1;transform:translateY(0);letter-spacing:14px}}
/* 污染 */
#glitch.cinr .lnd{color:#ff5a4b;animation:cin-seep 2.2s .2s forwards;opacity:0;position:relative}
#glitch.cinr .lnbig{font-size:70px;text-align:center;line-height:1.2;color:#e21818;text-shadow:0 0 40px rgba(255,0,0,.8),0 0 90px rgba(255,0,0,.5);animation:cin-seep 1s .2s forwards,bigthrob 1.4s infinite}
@keyframes bigthrob{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
#glitch.cinr .flood{font-size:12px;color:#8a2b2b;line-height:1.7;letter-spacing:1px;white-space:pre-wrap;animation:cin-seep 1.4s .2s forwards}
#glitch.cinr .cracked{color:#ff5a4b;text-shadow:1px 1px 0 #7a1a1a,2px 2px 0 #5e1010;animation:cin-seep 2s .2s forwards}
#glitch.cinr .drip{font-size:40px;text-align:center;letter-spacing:16px;color:#ff4a3a;animation:floatup 4s 1s forwards,drift 2s infinite}
@keyframes drift{0%,100%{filter:drop-shadow(0 0 0 transparent)}50%{filter:drop-shadow(0 6px 10px rgba(255,0,0,.6))}}
/* 满屏累积溢出的词块（一个好喜欢 / 为什么 / 我好疼 / 你弄疼我了，一个个浮现越推越满） */
#glitch .burst{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#glitch .burst .bword{position:absolute;font-weight:900;white-space:nowrap;animation:pop .32s forwards}
@keyframes pop{0%{opacity:0;transform:scale(.3)}70%{opacity:1}100%{opacity:1;transform:scale(1)}}
#glitch .burst .bword.good{color:#4fd96a;text-shadow:0 0 20px #37b34d;font-size:20px;letter-spacing:3px}
#glitch .burst .bword.bad{color:#ff3030;text-shadow:0 0 16px #a00000;font-size:15px;letter-spacing:1px}
#glitch .burst .bword.redblock{color:#ff2020;text-shadow:0 0 24px #ff0000;font-size:20px;letter-spacing:2px;background:rgba(120,0,0,.28);padding:2px 8px;border-radius:2px}
#glitch .burst .bword.big{font-size:64px;color:#ff2020;text-shadow:0 0 46px #ff0000,0 0 90px rgba(255,0,0,.6)}
/* 键盘打字：一个字一个字敲出来，带闪烁光标 */
#glitch .typed{opacity:0;font-size:17px;line-height:2;letter-spacing:1px;margin-top:14px}
#glitch .typed.dim{color:#8fbf9f}
#glitch .caret{display:inline-block;width:9px;height:1.05em;background:currentColor;vertical-align:-2px;margin-left:2px;animation:cblink .55s steps(1) infinite}
@keyframes cblink{0%,100%{opacity:1}50%{opacity:0}}
#glitch .finaltop{position:absolute;top:22px;left:0;right:0;text-align:center;font-size:20px;z-index:4}
#glitch .finaltop .typed{font-size:20px;letter-spacing:8px;margin-top:0}
#glitch .finaltop .typed.dim{color:inherit}
/* 通用：结局/退出黑屏的键盘打字 */
.blinkcaret{display:inline-block;width:10px;height:1.1em;background:currentColor;vertical-align:-3px;margin-left:2px;animation:cblink .5s steps(1) infinite}
.tt{display:block;opacity:0;white-space:pre-wrap}
.tt.on{opacity:1}

/* 结语 */
#overlay{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;text-align:center;padding:30px}
#overlay.show{display:flex}
#overlay .ov-in{max-width:640px;color:inherit}
#overlay .ov-text{font-size:22px;line-height:2;font-weight:500;white-space:pre-wrap}
#overlay .ov-sub{font-size:13px;margin-top:20px}
#overlay .ov-close{margin-top:32px;padding:11px 28px;font-size:14px;cursor:pointer;font-family:inherit;background:transparent;border:1px solid currentColor;border-radius:4px}
#overlay.er{background:rgba(20,0,0,.95);color:#ff7a6a}
#overlay.eg{background:rgba(4,16,8,.95);color:#9adf7a}
.ov-dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-left:8px;animation:beat 1.2s ease-in-out infinite}
#overlay.er .ov-dot{background:#ff4b3a;box-shadow:0 0 14px #ff4b3a}
#overlay.eg .ov-dot{background:#7ee6a0;box-shadow:0 0 14px #7ee6a0}
@keyframes beat{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.35);opacity:.6}}

/* 离开防护 */
#quit-g{position:fixed;inset:0;z-index:35;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.92);text-align:center;padding:30px}
#quit-g.show{display:flex}
#quit-g .qg-t{font-size:18px;line-height:2;white-space:pre-wrap}
#quit-g button{margin-top:26px;padding:11px 30px;font-family:inherit;cursor:pointer;background:transparent;border:1px solid currentColor;border-radius:4px}
body.gm #quit-g{color:#7ee6a0}body.rm #quit-g{color:#ff5a4b}

/* 开场 */
#intro{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:var(--bg0);transition:opacity .8s;text-align:center}
#intro.hide{opacity:0;pointer-events:none}
#intro .inn{max-width:560px;padding:30px}
#intro h1{font-size:22px;letter-spacing:3px;margin-bottom:22px;color:#2b2b2b;font-weight:500}
#intro p{font-size:14px;color:#6b6b6b;line-height:1.9;margin-bottom:6px}
#intro .note{font-size:12px;color:#aaa;margin-top:22px;font-style:italic}
#intro button{margin-top:26px;padding:12px 40px;font-size:15px;font-family:inherit;cursor:pointer;background:#2b6b2b;color:#fff;border:none;border-radius:4px;letter-spacing:2px}
#intro button:hover{background:#1f5a1f}

#corner{position:fixed;right:20px;bottom:18px;z-index:6;font-size:13px;opacity:0;transition:opacity 1.8s;letter-spacing:1px;user-select:none}
body.gm #corner{color:#7ee6a0}body.rm #corner{color:#ff5a4b}
#corner.on{opacity:.7}

.caret::after{content:"\25CD";animation:blink 1s infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}

/* 脉搏震动 */
@keyframes pulseShake{0%,100%{transform:translate(0)}10%{transform:translate(0,-1px)}20%{transform:translate(0)}}
body.pulse #app{animation:pulseShake .3s ease}

/* ════ 结局电影层 ════ */
.ending-cv{position:fixed;inset:0;z-index:5;overflow:hidden;background:#000}
.ending-cv.ecv-green{background:radial-gradient(130% 130% at 50% 25%,#1a4a22 0%,#0a3014 45%,#021408 100%)}
/* 渗出文字（自下而上，像液体一样往上渗） */
.seep{position:absolute;left:0;right:0;bottom:12%;text-align:center;color:#ff9a86;font-size:19px;line-height:2.2;opacity:0;transform:translateY(70px);text-shadow:0 0 16px rgba(255,40,20,.45)}
.seep.show{opacity:1;transform:translateY(0);transition:opacity 2.5s ease,transform 7s cubic-bezier(.2,.6,.3,1)}
.seep .s-line{white-space:nowrap}
/* 露滴文字（自上而下，像露水一滴滴落下） */
.dew{position:absolute;left:0;right:0;top:16%;text-align:center;color:#9ff0c0;font-size:19px;line-height:2.1;opacity:0;transform:translateY(-40px);text-shadow:0 0 14px rgba(80,220,120,.4)}
.dew.show{opacity:.96;transform:translateY(0);transition:opacity 2.2s ease,transform 5.5s cubic-bezier(.1,.7,.3,1)}
.dew .d-line{white-space:nowrap}
/* 巨大树根/触手阴影（从下往上覆盖） */
.tent{position:absolute;left:-20%;right:-20%;bottom:-30%;top:20%;background:
  radial-gradient(rgba(34,6,3,.9) 42%,transparent 43%),
  radial-gradient(40% 40% at 30% 30%,rgba(50,10,4,.5) 0%,transparent 60%),
  radial-gradient(40% 40% at 70% 20%,rgba(44,9,4,.55) 0%,transparent 60%),
  radial-gradient(50% 50% at 50% 10%,rgba(60,14,6,.6) 0%,transparent 65%);
  opacity:0;filter:blur(1px);transition:opacity 7s ease}
.tent.show{opacity:1}
/* 枯黑树皮 + 裂纹字 */
.bark{position:absolute;inset:0;opacity:0;transition:opacity 3.5s ease;background:
  repeating-linear-gradient(90deg,transparent 0 9px,rgba(0,0,0,.38) 9px 11px),
  repeating-linear-gradient(0deg,transparent 0 5px,rgba(0,0,0,.22) 5px 7px),
  radial-gradient(120% 120% at 50% 50%,#1c0d0a 0%,#0b0504 100%)}
.bark.show{opacity:1}
.bark .crack{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#100604;font-size:40px;font-weight:900;letter-spacing:14px;text-shadow:2px 2px 0 rgba(0,0,0,.9),-1px -1px 0 rgba(255,120,90,.22),0 0 2px #000}
#overlay.er .bark .crack{color:#ff3b30;text-shadow:2px 2px 0 rgba(0,0,0,.9),0 0 30px rgba(255,50,30,.7)}
/* 种子/心脏 */
.seed{position:absolute;left:50%;top:56%;width:150px;height:150px;transform:translate(-50%,-50%);border-radius:50%;opacity:0;
  background:radial-gradient(circle at 50% 45%,rgba(215,255,230,.9) 0%,rgba(130,225,160,.55) 20%,rgba(40,130,70,.35) 48%,rgba(10,55,28,.92) 72%);
  box-shadow:0 0 70px rgba(70,210,130,.5),inset 0 0 34px rgba(25,85,45,.85),inset 0 0 70px rgba(80,180,120,.4);
  animation:seedbeat 1.6s ease-in-out infinite}
.seed.show{opacity:1}
@keyframes seedbeat{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.1)}}
.seed::before{content:"";position:absolute;left:50%;top:50%;width:72%;height:72%;transform:translate(-50%,-50%);border-radius:50%;border:2px solid rgba(130,225,170,.75);box-shadow:inset 0 0 26px rgba(70,170,110,.6)}
.seed::after{content:"";position:absolute;left:50%;top:50%;width:30%;height:30%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,#f2fff7 0%,#a8edbc 58%,#43ad6e 100%);box-shadow:0 0 26px rgba(190,255,220,.95)}

.seed-cap{position:absolute;left:0;right:0;top:74%;text-align:center;color:#aef0ca;font-size:14px;line-height:2;opacity:0;text-shadow:0 0 10px rgba(60,180,100,.5);transition:opacity 2.5s ease}
.seed-cap.show{opacity:1}

  <div class="inn">

</div>

</div>

<script>
"use strict";
/* ============================================
   21题题库
   kind: choice | fill | glitch | branch | branch2 | branch3 | branch4 | fakequit | fakeend | ending
   progress: {pct, knowledge, distance, sub}  进度条动态
   showAs: 显示的题号(跳号)
   hasBlank: 空选项呼吸
   trap: 选此项触发弹窗
   fakeEnd: 假结束
   backTrap: 上一题按钮变异
   corrupt: 错版字体
   titleCorrupt: 题目文字重影

var Q=[
  // ═══ 伪装期 Q1-Q5 ═══
  {st:1, sub:'日常习惯', q:'1. 您平时会随身携带环保购物袋吗？',
   kind:'choice', opts:[{t:'A. 会，已经习惯了',eco:1},{t:'B. 有时会',eco:.5},{t:'C. 基本不会，太麻烦',poll:1},{t:'D. 塑料袋又怎样',poll:1.5}],
   progress:{pct:4}},
  {st:1, sub:'分类意识', q:'2. 对于垃圾分类，您的做法是？',
   kind:'choice', opts:[{t:'A. 严格分类',eco:1},{t:'B. 大致分一下',eco:.5},{t:'C. 看心情',poll:.5},{t:'D. 分不分没差别',poll:1}],
   progress:{pct:2}},
  {st:1, sub:'生活态度', q:'3. 您认为环保和您个人生活关系大吗？',
   kind:'choice', opts:[{t:'A. 很大，地球是我们的家',eco:1},{t:'B. 有点关系',eco:.5},{t:'C. 大人物管就好',poll:1},{t:'D. 一个人能改变什么',poll:1.5}],
   progress:{pct:6, sub:'匿名进行，请放心填写'}},
  {st:1, sub:'出行偏好', q:'4. 条件允许时，您倾向哪种出行方式？',
   kind:'choice', showAs:'7', hasBlank:true,
   opts:[{t:'A. 步行或骑行',eco:1},{t:'B. 公共交通',eco:.5},{t:'C. 自己开车',poll:.5},{t:'D. 能坐车绝不走路',poll:1}],
   progress:{knowledge:3}},
  {st:1, sub:'观念', q:'5. 人类和自然，应该是什么关系？',
   kind:'choice', opts:[{t:'A. 共生，彼此守护',eco:1},{t:'B. 自然为人服务',poll:.5},{t:'C. 人定胜天',poll:1.5},{t:'D. 关我什么事',poll:2}],
   progress:{pct:11}},

  // ═══ 假结束 Q6 ═══
  {st:1, sub:'', q:'6. 问卷即将进入下一阶段……',
   kind:'fakeend', progress:{pct:15}},

  // ═══ 偏题 Q7-Q10 ═══
  {st:2, sub:'生态环境', q:'7. 您上一次抬头看树，是什么时候？',
   kind:'choice', opts:[{t:'A. 就在不久前',eco:1},{t:'B. 偶尔会看',eco:.5},{t:'C. 树有什么好看的',poll:1},{t:'D. 城市里哪有树',poll:1.5}],
   progress:{knowledge:8, sub:'匿名？可我已经知道你的气味了。'}},
  {st:2, sub:'居住情况', q:'8. 您平时……一个人住吗？',
   kind:'choice', alone:true,
   opts:[{t:'A. 是',eco:0},{t:'B. 和家人',eco:0},{t:'C. 有室友',eco:0},{t:'D. ……',eco:0}],
   progress:{knowledge:14}},
  {st:2, sub:'森林意识', q:'9. 如果森林在慢慢靠近您的城市，您会觉得？',
   kind:'choice', trap:true,
   opts:[{t:'A. 向往，想去看看',eco:1},{t:'B. 有点奇怪',eco:0},{t:'C. 害怕，想砍掉它',poll:1.5},{t:'D. 它敢来就铲平',poll:2}],
   progress:{knowledge:22}},
  {st:2, sub:'开放反馈', q:'10. 请描述一下，您对"森林"的第一印象。',
   kind:'fill', hint:'（随便写几个字就好）',
   progress:{knowledge:30}},

  // ═══ 爆发 Q11-Q15 ═══
  {st:2, sub:'最终意识', q:'11. 您更爱这片土地的生机，还是您自己省下来的一点便利？',
   kind:'choice', opts:[{t:'A. 生机，太珍贵了',eco:1},{t:'B. 都爱',eco:0},{t:'C. 先舒服再说',poll:1.5},{t:'D. 土地？它又不说话',poll:2}],
   progress:{distance:1.7, sub:'别关页面。再回答我几个问题。'}},
  {st:3, sub:'——', q:'12. 数据校准中……',
   kind:'glitch', lucid:['别怕','我不是在凶你','我只是……太爱了'],
   glitch:['系统检测到：有人在看这片森林。','▓▓▓ 它察觉到了 ▓▓▓','▓▓▓ 它正在向你走来 ▓▓▓','你听到水滴声了吗','那是它在靠近','别动','▓▓▓ 它来了 ▓▓▓']},
  {st:3, sub:'（它好像一直在盯着答题的你）', q:'13. 您诚实了吗？刚才那些选项，您都如实选了吗？',
   kind:'fill', hint:'请输入：是 / 不是 / 说实话……', corrupt:true,
   progress:{distance:1.2}},
  {st:3, sub:'——', q:'14. 您觉得，一片森林可以记住一个人多久？',
   kind:'choice', backTrap:true, titleCorrupt:true,
   opts:[{t:'A. 很久很久',eco:1},{t:'B. 也许一辈子',eco:.5},{t:'C. 记不住吧',poll:1},{t:'D. 森林哪有记忆',poll:2}],
   progress:{distance:.8}},
  {st:3, sub:'——', q:'15. 如果这片土地最后只剩您一个人愿意救它，您还会救吗？',
   kind:'choice', opts:[{t:'A. 会，哪怕只剩我一个',eco:1},{t:'B. 会试试',eco:.5},{t:'C. 那我也放弃',poll:1},{t:'D. 它配吗',poll:2}],
   progress:{distance:.3}},

  // ═══ 结局 Q16-Q21 ═══
  {st:4, sub:'——', q:'16.', kind:'fakequit'},
  // 17：渴望（环保）/ 污浊质问（污染）
  {st:4, sub:'（它察觉到了结局）', q:'17.',
   kind:'branch', corrupt:true, titleCorrupt:true,
   eq:'你今天……呼吸的时候，有闻到我的味道吗？就是那种，雨后泥土，混着一点腐烂叶子的味道。',
   pq:'你的肺里，现在呼吸的空气，有多少是我为你过滤的？你……分得清，你和我的界限吗？',
   ecoOpts:[{t:'闻到了。很安心。'},{t:'……没有。'},{t:'那是什么味道？'}],
   pollOpts:[{t:'分不清。'},{t:'我不想分。'},{t:'你凭什么，替空气作主。'}]},
  // 18：模仿人类（环保）/ 步步紧逼（污染）
  {st:4, sub:'（它把一样东西放在你面前）', q:'18.',
   kind:'branch2',
   eq:'我听说，人类表达喜欢，是……送花。我把我的……开得最好看的那朵……摘给你了。你……收到了吗？',
   pq:'我把整片海都捂成墨色来等你。你呢？你连回头，都不肯拾起我落一地的落叶吗？请你……再看我一眼。'} ,
  // 19：融合的邀请（环保）/ 只准选我（污染）
  {st:4, sub:'（最后一步）', q:'19.',
   kind:'branch3',
   eq:'你的手掌，可以……放在土壤上吗？我想……感觉一下你的温度。只要一下下。',
   pq:'你听着。这里……没有别的选项了。'} ,
  // 20：它的最后一句话（环保小心翼翼 / 污染歇斯底里）
  {st:4, sub:'（……）', q:'20. 它说出了最后一句话。',
   kind:'branch4',
   eq:'我喜欢你。我这一千年，第一次，这么喜欢一个会回应我的人。你愿意……让我用最单纯、最笨、最绿的方式，缠住你不放吗？',
   pq:'这辈子，我从没求过人。求你一次……让我陪你到最后，哪怕是陪你一起，灰暗下去。',
   ecoOpts:[{t:'我愿意。缠住我不放吧。'},{t:'……让我想想'}],
   pollOpts:[{t:'好。你是我一个人的。'},{t:'……我躲不开了。'}]} ,
  {st:4, sub:'结语', q:'21. 满意度调查已结束。谢谢你的参与。', kind:'ending'}
];

/* ============ 状态 ============ */
var idx=0,locked=false,mode='n',eco=0,poll=0,prevInput='',hist=[];
var heartbeatTimer=null,titleTimer=null,backTrapped=false;
var THRESHOLD=8;

/* ============ DOM ============ */
var qEl=document.getElementById('question');
var optsEl=document.getElementById('opts');
var fb=document.getElementById('feedback');
var fill=document.getElementById('fill');
var fillIn=document.getElementById('fillInput');
var fillB=document.getElementById('fillBtn');
var subEl=document.getElementById('subtitle');
var mf=document.getElementById('meterFill');
var ml=document.getElementById('meterLabel');
var mv=document.getElementById('meterVal');
var ps=document.getElementById('psub');
var hint=document.getElementById('hint');
var bBtn=document.getElementById('backBtn');
var corner=document.getElementById('corner');
var gEl=document.getElementById('glitch');
var ov=document.getElementById('overlay');
var ovT=document.getElementById('ovText');
var ovS=document.getElementById('ovSub');
var qg=document.getElementById('quit-g');
var qgT=document.getElementById('qgT');
var blood=document.getElementById('bloodink');
var pop=document.getElementById('popup');
var fq=document.getElementById('fakequit');
var fe=document.getElementById('fakeend');

/* ============ 音频 ============ */
var actx=null,mG=null,oN=[];
function eA(){if(!actx){try{actx=new(window.AudioContext||window.webkitAudioContext)}catch(e){}}if(actx&&actx.state==='suspended')actx.resume()}
function sDr(lv){eA();if(!actx)return;if(!mG){mG=actx.createGain();mG.gain.value=0;mG.connect(actx.destination)}while(oN.length)oN.pop().stop();if(lv>0){[45,55].forEach(function(fr){var o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=fr;g.gain.value=.0016*lv+.0004;o.connect(g);g.connect(mG);o.start();oN.push(o)})}mG.gain.setTargetAtTime(lv>0?.5:0,actx.currentTime,1.5)}
function hB(){eA();if(!actx||!mG)return;var o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;o.type='square';o.frequency.value=320;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.12,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.4);o.connect(g);g.connect(mG);o.start(t);o.stop(t+.45)}
function bl(s){eA();if(!actx||!mG)return;var o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;o.type='triangle';o.frequency.value=s?1400:880;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.08,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.25);o.connect(g);g.connect(mG);o.start(t);o.stop(t+.3)}
function heartbeat(){eA();if(!actx||!mG)return;var o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;o.type='sine';o.frequency.setValueAtTime(60,t);o.frequency.exponentialRampToValueAtTime(30,t+.15);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.15,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+.18);o.connect(g);g.connect(mG);o.start(t);o.stop(t+.2)}
function drip(){eA();if(!actx||!mG)return;var o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;o.type='sine';o.frequency.setValueAtTime(2000,t);o.frequency.exponentialRampToValueAtTime(800,t+.08);g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.0001,t+.12);o.connect(g);g.connect(mG);o.start(t);o.stop(t+.15)}

/* ============ 打字机 ============ */
function typeT(el,text,iv,done){el.classList.add('caret');el.style.opacity='1';var i=0;el.textContent='';(function st(){if(i<text.length){el.textContent+=text[i];i++;setTimeout(st,iv)}else{el.classList.remove('caret');if(done)done()}})()}
function say(s,c){if(c)fb.className='feedback on '+c;setTimeout(function(){typeT(fb,s,30,function(){setTimeout(next,1500)})},3000)}
/* 通用键盘打字：一字一字敲出 + 闪烁光标，完成后回调 */
function typew(el,text,speed,done){
  el.classList.add('on');el.textContent='';
  var caret=document.createElement('span');caret.className='blinkcaret';el.appendChild(caret);
  var i=0;
  (function st(){
    if(i<text.length){el.insertBefore(document.createTextNode(text[i]),caret);i++;setTimeout(st,speed)}
    else{caret.remove();if(done)setTimeout(done,250)}
  })();
}

/* ============ 进度条 ============ */
function updProg(item){
  var p=item.progress;
  if(!p){
    // 默认：按题数
    var pct=Math.round((idx/Q.length)*100);
    ml.textContent='你对我的了解';
    mv.textContent=pct+'%';
    return;
  }
  if(p.pct!==undefined){ml.textContent='问卷完成度';mv.textContent=p.pct+'%';}
  else if(p.knowledge!==undefined){ml.textContent='你对我的了解';mv.textContent=p.knowledge+'%';}
  else if(p.distance!==undefined){ml.textContent='你离我';mv.textContent=p.distance+'米';}
  mf.style.width=Math.min(98,p.knowledge||p.pct||(p.distance?100-p.distance*10:0))+'%';
  if(p.sub!==undefined)ps.textContent=p.sub;
}

/* ============ 标签页标题 ============ */
function startTitle(){var titles=['别走。','再待一会儿。','别走。','我还在看着你。','你真的要走吗？','别关页面。'];var ti=0;titleTimer=setInterval(function(){document.title=titles[ti%titles.length];ti++},4000)}
function stopTitle(){clearInterval(titleTimer);document.title='环境保护意识调查问卷'}

/* ============ 心跳音效 ============ */
function startHB(){heartbeatTimer=setInterval(function(){if(eco>poll)heartbeat();else drip()},3500)}
function stopHB(){clearInterval(heartbeatTimer)}

/* ============ 模式 ============ */
function cMode(){return poll>=THRESHOLD?'red':'green'}
function qText(it){return mode==='red'?(it.pq||it.q):(it.eq||it.q)}
function apMode(m){
  if(m===mode)return;mode=m;
  document.body.className=m==='red'?'rm':m==='green'?'gm':'';
  blood.innerHTML='';sDr(m==='red'?3:poll>2?1:0);
  if(m==='red'){for(var i=0;i<14;i++){var d=document.createElement('i');d.className='drop';d.style.left=Math.random()*100+'%';d.style.animationDuration=(3+Math.random()*5)+'s';d.style.animationDelay=Math.random()*4+'s';d.style.height=(16+Math.random()*40)+'px';blood.appendChild(d)}hB()}
}

/* ============ 渲染 ============ */
function render(){
  locked=false;backTrapped=false;bBtn.className='';
  var it=Q[idx];
  if(idx>=14)apMode(cMode());
  subEl.textContent=it.sub||'';
  hint.textContent=it.hint||'';
  qEl.classList.remove('in','corrupt');qEl.textContent='';
  optsEl.innerHTML='';fb.className='feedback';fb.style.opacity='0';fb.textContent='';
  fill.classList.remove('show');fillB.disabled=false;fillIn.value='';
  updProg(it);

  // 特殊类型
  if(it.kind==='glitch'){renderGlitch(it);return}
  if(it.kind==='fakequit'){renderFakeQuit();return}
  if(it.kind==='fakeend'){renderFakeEnd();return}
  if(it.kind==='ending'){renderEnding2();return}

  setTimeout(function(){
    var qt=qText(it);
    qEl.innerHTML=(it.showAs?'<span style="opacity:.35;font-size:13px">第 '+it.showAs+' 题</span><br>':'<span style="opacity:.35;font-size:13px">第 '+(idx+1)+' 题</span><br>')+qt;
    if(it.corrupt&&mode==='red'){qEl.classList.add('corrupt');qEl.setAttribute('data-ghost',qt)}
    if(it.titleCorrupt&&mode==='red')qEl.style.textShadow='1px 0 rgba(255,80,60,.3),-1px 0 rgba(100,200,100,.25)';
    qEl.classList.add('in');

    if(it.kind==='choice'){
      var opts=it.opts.slice();
      if(it.hasBlank)opts.push({t:'　',blank:true});
      opts.forEach(function(o,i){
        var b=document.createElement('button');
        b.className='opt'+(o.blank?' blank-opt':'')+(it.trap&&o.poll?' damp':'');
        b.innerHTML=o.t;
        if(!o.blank&&it.trap&&o.poll){var d=document.createElement('i');d.className='drip';b.appendChild(d);drip(d)}
        b.onclick=function(){answer(i,o,it)};
        optsEl.appendChild(b);
      });
    }else if(it.kind==='fill'){
      fill.classList.add('show');
      setTimeout(function(){fillIn.focus()},600);
    }else if(it.kind==='branch'||it.kind==='branch2'||it.kind==='branch3'||it.kind==='branch4'){
      renderBranch(it);
    }
  },420);
}

/* ============ glitch（分线前 Q12/13 之间的入侵黑屏） ============ */
function renderGlitch(it){
  gEl.textContent='';
  var redTrack=(mode==='red'||poll>=THRESHOLD);
  var cin=document.createElement('div');
  cin.className='cin';
  gEl.appendChild(cin);

  /* 键盘打字：一个字一个字敲出来，带闪烁光标 */
  function type(el,txt,speed,opts){
    opts=opts||{};
    el.style.opacity='1';
    if(opts.spread)el.style.letterSpacing='8px';
    return new Promise(function(res){
      var i=0,caret=document.createElement('span');caret.className='caret';el.appendChild(caret);
      (function st(){
        if(i<txt.length){el.insertBefore(document.createTextNode(txt[i]),caret);i++;setTimeout(st,speed)}

    });
  }
  function line(txt,cls){var d=document.createElement('span');d.className='typed '+(cls||'');d.textContent='';cin.appendChild(d);return d}
  /* 满屏累积词：随机散点、顺序随机、一个个浮现 */
  function scatter(pool,stagger){
    var box=document.createElement('div');box.className='burst';gEl.appendChild(box);
    lastBox=box;
    var arr=[];for(var n=0;n<pool.length;n++){for(var r=0;r<pool[n].count;r++){arr.push({t:pool[n].t,c:pool[n].c})}}
    for(var a=arr.length-1;a>0;a--){var b=Math.floor(Math.random()*(a+1));var tmp=arr[a];arr[a]=arr[b];arr[b]=tmp}
    for(var k=0;k<arr.length;k++){(function(itm){setTimeout(function(){
      var s=document.createElement('span');s.className='bword '+itm.c;s.textContent=itm.t;

      s.style.top=(4+Math.random()*86)+'%';
      s.style.transform='rotate('+(Math.random()*18-9)+'deg)';
      box.appendChild(s);
    },k*stagger)})(arr[k])}
    return arr.length*stagger;
  }
  var lastBox=null;
  (async function(){
    var dur;
    if(!redTrack){
      // 环保：黑屏 → 键盘打字出句 → 「好喜欢」散点50个 → 顶部末句

      await wait(200);
      await type(line('只是  你回答得太好了'),'只是  你回答得太好了',120,{spread:true});
      await wait(200);
      await type(line('我在这里待了太久  太久了'),'我在这里待了太久  太久了',105);
      await wait(200);
      await type(line('你是第一个  让我觉得'),'你是第一个  让我觉得',90);
      await type(line('世界  重新开始呼吸的人'),'世界  重新开始呼吸的人',100);
      await wait(400);
      dur=scatter([{t:'▓▓▓▓ 好喜欢 ▓▓▓▓',c:'good',count:50}],130);
      await wait(dur+300);                    // 等好喜欢铺满
      if(lastBox)lastBox.remove();            // 全部消失
      cin.innerHTML='';
      var tl=document.createElement('span');tl.className='typed';tl.textContent='';tl.style.fontSize='34px';cin.appendChild(tl);
      await type(tl,'我 好 想 见 见 你',150,{spread:true});
      await wait(5600);
    }else{
      // 污染：黑屏 → 键盘打字出句 → 四类词随机散点 → 顶部末句
      await wait(1300);
      await type(line('你'),'你',280);
      await wait(2300);
      await type(line('你在做什么'),'你在做什么',120);
      await wait(300);
      await type(line('我一直在看  从头到尾  每一题  都在看'),'我一直在看  从头到尾  每一题  都在看',90);
      await wait(400);
      dur=scatter([
        {t:'我恨你',c:'big',count:7},
        {t:'为什么',c:'bad',count:16},
        {t:'我好疼',c:'bad',count:16},
        {t:'你弄疼我了',c:'redblock',count:11}
      ],150);
      await wait(dur+400);                    // 等满屏
      if(lastBox)lastBox.remove();            // 全部消失
      cin.innerHTML='';
      var tl=document.createElement('span');tl.className='typed';tl.textContent='';tl.style.fontSize='34px';cin.appendChild(tl);
      await type(tl,'我 会 找 到 你 的',130,{spread:true});

    }
    gEl.className='';

  })();
}

/* ============ 选答 ============ */
function answer(i,o,it){
  if(locked)return;locked=true;
  var btns=optsEl.querySelectorAll('.opt');
  btns.forEach(function(b,j){if(j!==i)b.classList.add('dim');b.disabled=true});
  // 空选项：闪苔藓照片→跳回
  if(o.blank){
    var fake=document.createElement('div');
    fake.style.cssText='position:fixed;inset:0;z-index:50;background:#1a2e10;display:flex;align-items:center;justify-content:center';
    // 用 CSS 渐变模拟苔藓/菌丝纹理
    var inner=document.createElement('div');
    inner.style.cssText='width:100vw;height:100vh;background:radial-gradient(ellipse at 30% 40%,#2a4a1a 0%,#0e2a13 40%,#050f04 100%);position:relative;overflow:hidden';
    for(var k=0;k<30;k++){
      var dot=document.createElement('div');
      dot.style.cssText='position:absolute;width:'+(4+Math.random()*8)+'px;height:'+(4+Math.random()*8)+'px;border-radius:50%;background:rgba(100,200,80,'+(.15+Math.random()*.3)+');top:'+Math.random()*100+'%;left:'+Math.random()*100+'%';
      inner.appendChild(dot);
    }
    var txt=document.createElement('div');txt.style.cssText='position:absolute;bottom:20%;left:50%;transform:translateX(-50%);color:rgba(180,230,160,.6);font-size:13px;letter-spacing:3px;white-space:nowrap';txt.textContent='你看到了什么？';
    inner.appendChild(txt);fake.appendChild(inner);
    document.body.appendChild(fake);
    setTimeout(function(){fake.remove();locked=false;
      // 恢复其余选项可用
      optsEl.querySelectorAll('.opt').forEach(function(b){b.disabled=false;b.classList.remove('dim')});
    },800);
    return;
  }
  // 弹窗求饶（陷阱题选污染时）
  if(it.trap&&o.poll){
    pop.classList.add('show');
    document.getElementById('pTitle').innerHTML='此选项可能不准确，是否重新考虑？';
    // "好" = 坚持污染；"我错了" = 反悔改环保
    document.getElementById('pOk').onclick=function(){
      pop.classList.remove('show');
      poll+=o.poll;
      updProg(it);
      fl(idx,i,o,false);
    };
    document.getElementById('pAlt').onclick=function(){
      pop.classList.remove('show');
      // 反悔：不计污染，反而算作环保的倾听（分线前不回话，直接推进）
      eco+=1;
      updProg(it);
      setTimeout(next,800);
    };
    return;
  }
  // 正常累积
  if(o.eco)eco+=o.eco;
  if(o.poll){poll+=o.poll;updProg(it);if(idx>=8&&poll>=THRESHOLD&&mode!=='red')apMode('red')}
  else if(o.eco)updProg(it);
  if(idx>=16){brFl(idx,i);return}
  fl(idx,i);
}

  if(it.kind==='branch4'){
    typeT(fb,r?it.pq:it.eq,30,function(){
      setTimeout(function(){
        var opts=r?it.pollOpts:it.ecoOpts;

          };

    });

/* 题目之间的乱码入侵：非常规字体/乱码，一闪而过，或伪装成"加载错误" */
var GF_MSGS=['我……看到……你……了……','▓▓▒▒░░ 你喜欢……绿色吗？ ░░▒▒▓▓','▓▓▓ 正在读取你的呼吸 ▓▓▓','加载错误：无法解析第 ? 题','▓▓ ERROR ▓▓ 数据不对劲……','它……就在这里……','>> 你刚才……看它了吗？','▓搅▓ 我等你很久了 ▓动▓'];
function glitchFlash(){
  var f=document.createElement('div');
  f.style.cssText='position:fixed;left:0;right:0;top:0;z-index:29;padding:7px 16px;background:rgba(8,3,3,.85);font-family:monospace;font-size:12px;color:'+(mode==='red'?'#ff7a6a':'#7ee6a0')+';letter-spacing:2px;pointer-events:none;opacity:0;transition:opacity .25s';
  f.textContent=GF_MSGS[Math.floor(Math.random()*GF_MSGS.length)];
  document.body.appendChild(f);
  setTimeout(function(){f.style.opacity='1'},80);
  setTimeout(function(){f.style.opacity='0'},3200);
  setTimeout(function(){f.remove()},3800);
}
/* 上一份问卷的记忆：再次进入，开场不再是欢迎语 */
(function(){
  try{

      if(ps[2])ps[2].innerHTML='（上一份问卷……不是你亲手填完的吗？）';
    }
  }catch(e){}
})();

};

};

});
